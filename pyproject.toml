[project]
name = "judge"
version = "0.1.0"
description = "A local LLM deciding refunds on credit card purchase-dispute complaints, scored against recorded company decisions."
requires-python = ">=3.12"   # numpy 2.5.4 and scipy 1.18.1 in requirements.txt require 3.12

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
